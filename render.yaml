services:
  - type: web
    name: healthpick-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
        - rpa/**
        - requirements.txt
        - Dockerfile
        - render.yaml
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://healthpick.onrender.com
      - key: BACKEND_URL
        value: https://healthpick-api.onrender.com
      - key: DEMO_ACCOUNTS_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
