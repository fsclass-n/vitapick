[build]
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/dist"
  ignore = "test -n \"$CACHED_COMMIT_REF\" && test \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- frontend netlify.toml"

[build.environment]
  NODE_VERSION = "24"
  VITE_API_URL = "https://vitapick-api.onrender.com"
